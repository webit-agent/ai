version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: competitor_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: competitor_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./backend
      target: builder
    container_name: competitor_tracker_api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/competitor_tracker
      JWT_SECRET: change_me_in_production
      PORT: 3000
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    command: npx ts-node src/index.ts

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: competitor_tracker_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
